<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión Pruebas de conssitencia</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .login-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .login-header img {
      max-height: 44px;
      margin-bottom: 0.75rem;
    }
    .login-header h1 {
      font-size: 1.2rem;
      margin: 0 0 0.25rem;
      font-weight: 700;
    }
    .login-header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 0;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 0.35rem;
      font-weight: 500;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 0.92rem;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    .error-box {
      background: rgba(127, 29, 29, 0.45);
      border: 1px solid #ef4444;
      color: #fecaca;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-login:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <form class="login-card" method="POST" action="/login" autocomplete="off">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">

    <div class="login-header">
      <img src="/static/logo.png" alt="Logo" onerror="this.style.display='none'">
      <h1>Acceso al Sistema</h1>
      <p>Sistema pruebas de consistencia</p>
    </div>

    {% if error_msg %}
      <div class="error-box">{{ error_msg }}</div>
    {% endif %}

    <div class="form-group">
      <label for="id_username">Usuario</label>
      <input id="id_username" name="username" type="text" required autofocus>
    </div>

    <div class="form-group">
      <label for="id_password">Contraseña</label>
      <input id="id_password" name="password" type="password" required>
    </div>

    <button class="btn-login" type="submit">Iniciar sesión</button>
  </form>
</body>
</html>
